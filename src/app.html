<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="author" content="Foundational Technologies, LLC">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('fv-site-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.colorScheme = theme;
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lexend:wght@450;550;650&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="%sveltekit.assets%/root.css" />
		<link rel="preconnect" href="https://www.youtube.com" />
		<link rel="preconnect" href="https://i.ytimg.com" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
